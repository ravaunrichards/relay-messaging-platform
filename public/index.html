<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b60"><title>Relay — Messaging</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main id="app"><section class="auth-card"><div class="brand-mark">R</div><h1>Relay</h1><p class="muted">Conversations that keep you connected.</p><div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div><form id="authForm"><label>Username<input name="username" required minlength="3" maxlength="24" autocomplete="username" placeholder="your_username"></label><label id="displayNameWrap" hidden>Display name<input name="displayName" maxlength="50" placeholder="Your name"></label><label>Password<input name="password" required minlength="8" type="password" autocomplete="current-password" placeholder="At least 8 characters"></label><button class="primary" type="submit" id="authSubmit">Sign in</button><p id="authError" class="error"></p></form></section></main><script src="/assets/app.js"></script></body></html>
